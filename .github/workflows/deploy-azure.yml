name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Logg inn i Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Logg inn i ACR
        run: az acr login --name tetrisreg

      - name: Bygg og push image
        run: |
          docker build -t tetrisreg.azurecr.io/vibe-tetris:${{ github.sha }} .
          docker push tetrisreg.azurecr.io/vibe-tetris:${{ github.sha }}

      - name: Deploy til Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: vibe-tetris
          containerAppEnvironment: vibe-tetris-env
          resourceGroup: Pipeline-tetris
          imageToDeploy: tetrisreg.azurecr.io/vibe-tetris:${{ github.sha }}
          acrName: tetrisreg
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}